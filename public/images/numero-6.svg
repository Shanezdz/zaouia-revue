<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#0f2d24"/>
  <rect x="90" y="90" width="1020" height="1420" fill="none" stroke="#c6aa76" stroke-width="2" opacity="0.7"/>
  <text x="110" y="170" fill="#c6aa76" font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="7">ZAOUIA · N°6</text>
  <text x="110" y="520" fill="#f3efe3" font-family="Georgia, 'Times New Roman', serif" font-size="92">Nous avons hérité</text>
  <text x="110" y="630" fill="#f3efe3" font-family="Georgia, 'Times New Roman', serif" font-size="92">d’un monde conçu</text>
  <text x="110" y="740" fill="#f3efe3" font-family="Georgia, 'Times New Roman', serif" font-size="92">pour l’abondance</text>
  <line x1="110" y1="830" x2="380" y2="830" stroke="#c6aa76" stroke-width="4"/>
  <text x="110" y="930" fill="#f3efe3" font-family="Georgia, 'Times New Roman', serif" font-size="42" opacity="0.88">Et si la question n’était plus de produire davantage,</text>
  <text x="110" y="990" fill="#f3efe3" font-family="Georgia, 'Times New Roman', serif" font-size="42" opacity="0.88">mais d’apprendre à habiter les limites ?</text>
  <text x="110" y="1450" fill="#c6aa76" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="3">IDÉES · LIMITES · RESSOURCES · GOUVERNANCE</text>
</svg>